[workspace]
# Deliberately its own workspace root (not a member of src-tauri's or loci-core's),
# so this crate's dependency graph never has to unify with the Tauri app's. Fully
# independent build: `cargo build` here never touches or is touched by src-tauri.
# loci-core is still shared with the app - via a path dependency, not workspace
# membership, so each side resolves it against its own separate Cargo.lock.

[package]
name = "loci-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing Loci-Lite bookmarks (atoms) and files to AI coding agents"

[[bin]]
name = "loci-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.3.0", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
loci-core = { path = "../loci-core" }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
